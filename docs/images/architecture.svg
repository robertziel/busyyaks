<svg xmlns="http://www.w3.org/2000/svg" width="720" height="478" viewBox="0 0 720 478" role="img" aria-label="How busyyaks works" font-family="Outfit, Futura, 'Century Gothic', 'Segoe UI', Helvetica, Arial, sans-serif"><title>How busyyaks works: the browser reaches the web container with a session cookie and the Claude Code sessions reach the mcp container with a bearer token; web, scanner, github, mcp and notifier run in docker compose over one database; a unix socket connects them to bin/launcher on the host, which starts the tmux sessions and captures their dialogs.</title><rect x=".5" y=".5" width="719" height="477" rx="10" fill="#fbfaf9" stroke="#ded7d6"/><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6d6567"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a2733"/></marker></defs><text x="16" y="30" font-size="14" fill="#191416" font-weight="700">How it works: the compose services, one database, one launcher on the host</text><text x="16" y="48" font-size="12" fill="#453e40">the operator's browser and the agents' MCP calls reach the same data</text><rect x="24" y="66" width="260" height="50" rx="5" fill="#14294d" fill-opacity=".045" stroke="#ded7d6" stroke-width="1.2"/><text x="154.0" y="88.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">browser (SPA)</text><text x="154.0" y="104.0" font-size="11.5" fill="#453e40" text-anchor="middle">the operator</text><rect x="430" y="66" width="266" height="50" rx="5" fill="#14294d" fill-opacity=".045" stroke="#7a2733" stroke-width="1.2"/><text x="563.0" y="88.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">Claude Code sessions (tmux)</text><text x="563.0" y="104.0" font-size="11.5" fill="#453e40" text-anchor="middle">the agents</text><line x1="160" y1="116" x2="160" y2="198" stroke="#6d6567" stroke-width="1.4" marker-end="url(#h)"/><text x="169" y="152" font-size="11.5" fill="#453e40">session cookie</text><line x1="593" y1="116" x2="593" y2="198" stroke="#7a2733" stroke-width="1.4" marker-end="url(#a)"/><text x="584" y="152" font-size="11.5" fill="#7a2733" text-anchor="end">bearer MCP_TOKEN</text><rect x="12" y="166" width="692" height="196" rx="8" fill="#5b6a80" fill-opacity=".1" stroke="#5b6a80" stroke-opacity=".26" stroke-width="1.2" stroke-dasharray="5 4"/><text x="26" y="187" font-size="12.5" fill="#191416" font-weight="700">docker compose</text><rect x="24" y="198" width="154" height="56" rx="5" fill="#14294d" fill-opacity=".045" stroke="#ded7d6" stroke-width="1.2"/><text x="101.0" y="223.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">web</text><text x="101.0" y="239.0" font-size="11.5" fill="#453e40" text-anchor="middle">JSON API + SPA shell</text><rect x="188" y="198" width="154" height="56" rx="5" fill="#14294d" fill-opacity=".045" stroke="#ded7d6" stroke-width="1.2"/><text x="265.0" y="223.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">scanner</text><text x="265.0" y="239.0" font-size="11.5" fill="#453e40" text-anchor="middle">git log · status · upstream</text><rect x="352" y="198" width="154" height="56" rx="5" fill="#14294d" fill-opacity=".045" stroke="#ded7d6" stroke-width="1.2"/><text x="429.0" y="223.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">github</text><text x="429.0" y="239.0" font-size="11.5" fill="#453e40" text-anchor="middle">network · feed · PRs</text><rect x="516" y="198" width="176" height="56" rx="5" fill="#14294d" fill-opacity=".045" stroke="#7a2733" stroke-width="1.2"/><text x="604.0" y="223.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">mcp</text><text x="604.0" y="239.0" font-size="11.5" fill="#453e40" text-anchor="middle">MCP server, local only</text><rect x="24" y="266" width="318" height="56" rx="5" fill="#14294d" fill-opacity=".045" stroke="#7a2733" stroke-width="1.2"/><text x="183.0" y="291.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">notifier</text><text x="183.0" y="307.0" font-size="11.5" fill="#453e40" text-anchor="middle">types comments + answers into a session · watchdog</text><rect x="352" y="266" width="340" height="56" rx="5" fill="#fbfaf9" stroke="#5b6a80" stroke-opacity=".5" stroke-width="1.2"/><text x="522.0" y="291.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">database</text><text x="522.0" y="307.0" font-size="11.5" fill="#453e40" text-anchor="middle">data/busyyaks.sqlite3 · or PostgreSQL</text><text x="26" y="344" font-size="11.5" fill="#453e40">every service reads and writes the one database; web, mcp and notifier also call the launcher</text><line x1="511" y1="362" x2="511" y2="404" stroke="#7a2733" stroke-width="1.4" marker-end="url(#a)"/><text x="500" y="388" font-size="11.5" fill="#7a2733" text-anchor="end">unix socket data/run/launcher.sock</text><rect x="352" y="404" width="340" height="56" rx="5" fill="#7a2733" fill-opacity=".1" stroke="#7a2733" stroke-width="1.2"/><text x="522.0" y="429.0" font-size="13.5" font-weight="700" fill="#191416" text-anchor="middle">bin/launcher (host, systemd --user)</text><text x="522.0" y="445.0" font-size="11.5" fill="#453e40" text-anchor="middle">starts tmux sessions · captures dialogs · clones</text><path d="M692 432 H710 V91 H700" fill="none" stroke="#7a2733" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="24" y="418" width="14" height="12" rx="2" fill="#14294d" fill-opacity=".045" stroke="#ded7d6" stroke-width="1.2"/><text x="44" y="428" font-size="12" fill="#191416">operator side</text><rect x="150" y="418" width="14" height="12" rx="2" fill="#14294d" fill-opacity=".045" stroke="#7a2733" stroke-width="1.2"/><text x="170" y="428" font-size="12" fill="#191416">agent side</text><rect x="260" y="418" width="14" height="12" rx="2" fill="#fbfaf9" stroke="#5b6a80" stroke-opacity=".5" stroke-width="1.2"/><text x="280" y="428" font-size="12" fill="#191416">both</text></svg>
