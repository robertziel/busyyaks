<svg xmlns="http://www.w3.org/2000/svg" width="736" height="438" viewBox="0 0 736 438" role="img" aria-label="The agent agency inside a human organisation" font-family="Outfit, Futura, 'Century Gothic', 'Segoe UI', Helvetica, Arial, sans-serif"><title>Org structure: I am one person inside a larger human organisation (leadership, product, design, other engineers). I lead my own agent agency, consulting-style: I talk directly to one team-lead agent per project, and each team lead has agents (junior level) spawned per ticket, each with its own subagents. Three projects are drawn, six more boards run the same way.</title><rect x=".5" y=".5" width="735" height="437" rx="10" fill="#fbfaf9" stroke="#ded7d6"/><g transform="translate(8 8)">

