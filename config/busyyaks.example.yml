# Copy to config/busyyaks.yml (gitignored). An unknown key is an error.
# Required (a missing one stops boot): roots, search_depth, owner_remotes, author_emails, window_days, auth,
#   reap_protect, agents, launch, dictation, terminal, ci.
# Optional: engines (absent = only config/engines.yml), daily_report_runners (absent = no daily report runner allowed).
#
# roots:          {path, prefix}: directories INSIDE the container whose children are git repos
#                 (compose mounts PROJECTS_ROOT read-only at /projects); prefix namespaces their slugs.
#                 A non-git child is a tree searched for repos (dirs with .git) without an entry of its own:
#                 they appear as group/<repo>, group/sub/<repo>. List it only to give it another prefix.
# search_depth:   how many subdirs below a root's non-git child to search for a repo (a repo is never
#                 descended into); nothing within that depth = the tree is given up. 0 = only root children.
# owner_remotes:  which `origin` remotes are yours (vs an upstream clone): host/path prefixes ("github.com/you/",
#                 "github.com:you/"), matched on a path-segment boundary after the URL is parsed (scheme, userinfo,
#                 port dropped; a path with `.`, `..` or `%` is never yours). Only https://, ssh:// and the scp form
#                 user@host:owner/repo are read: any other scheme, and the scp form without `user@` (host:owner/repo),
#                 is never yours (fails closed). Only the scanner's `own` flag (display) reads it: folder
#                 trust never does (launch.trusted_paths, docs/DEPLOY.md § Folder trust).
# author_emails:  commit author emails counted as "mine".
# window_days:    how far back the scanner reads history.
roots:
  - { path: /projects, prefix: "" }
  # a group folder under its own prefix (otherwise discovered as group/<repo>); a listed root that is not there fails
  # the scan, so list only folders that exist:
  # - { path: /projects/group, prefix: "grp/" }
search_depth: 2
owner_remotes:
  - github.com/your-user/
  - github.com:your-user/
author_emails:
  - you@example.com
window_days: 7
# (launchers — what the "Launch" button may start — and the agent types live in the database (Settings → Agents &
#  launchers; repo default config/agents.template.yml): ONE source for how a session is started; bin/launcher builds
#  the argv with the engine's Launch, only for an invocation on launch.commands below.)
# auth:          sign-in (README "Sign-in"). `provider: none` = no sign-in: every request is the operator — only for a
#                deployment reachable from localhost / an ssh tunnel, never behind a public proxy. It needs the explicit
#                `allow_unauthenticated: true` beside it (a boot without it stops), and every boot logs AUTH DISABLED. A custom provider:
#                `provider: <directory>` (relative to the app root) holding provider.rb (a Busyyaks::Auth::Provider
#                subclass); the block's other keys are that provider's settings, which it validates at boot.
auth:
  provider: none
  allow_unauthenticated: true
# reap_protect:   tmux session name globs the agents sidebar's "Clear idle" never stops — sessions a
#                 service owns and manages itself. [] for none, e.g. ["svc-*", "deploy"].
reap_protect: []
# agents:        the agent-session collector (README "Agent sessions"): a host program that writes a JSON snapshot of
#                 every tmux pane running a coding agent and answers screen/send requests on a unix socket.
#                 `collector: {snapshot: <file>, read_socket: <socket>}` (host paths, read by bin/launcher, which refuses
#                 to start while either is missing). busyyaks ships one: bin/collector, installed by
#                 deploy/install-collector.sh, writes exactly these two paths — both in ONE dir it creates 0700, outside
#                 PROJECTS_ROOT, this checkout and LAUNCHER_RUN_DIR. Another collector may write them instead.
#                 tmux_timeout_seconds (Integer 1..60, required): bin/collector's deadline on each tmux call — a
#                 hung tmux is killed and that request answers the error. answer_timeout_seconds (Integer, required,
#                 above 4 × tmux_timeout_seconds: a send is 4 tmux calls): bin/launcher's and `yaks doctor`'s
#                 deadline on the collector's whole answer — a collector that does not answer is refused by name.
#                 `collector: none` = this box runs none: no agents sidebar, no session states on cards, no Clear idle,
#                 no subagent list, no typing card comments or answers into sessions, no spotting a session stuck
#                 on a dialog before anyone comments (each says so where it shows); the dashboard, scanner, MCP,
#                 board, Launch, claim and reports work without it.
agents:
  collector:
    snapshot: /home/you/.local/state/busyyaks/collector/sessions.json
    read_socket: /home/you/.local/state/busyyaks/collector/read.sock
    tmux_timeout_seconds: 5
    answer_timeout_seconds: 30
  # collector: none
# dictation:     the card dialog's mic (and Alt+R held in an open card): speak, the words land in the comment box. The
#                 browser records 16 kHz WAV windows; the web service forwards each to your speech server — any
#                 OpenAI-compatible POST /v1/audio/transcriptions (docs/DEPLOY.md § Dictation) — at .env DICTATION_URL
#                 with the bearer DICTATION_TOKEN (web only; the browser never sees either).
#                 `none` = no mic anywhere (DICTATION_URL / DICTATION_TOKEN then empty), or
#                 {model: <the server's model id>, timeout_seconds: 1..300 (one window's request),
#                  max_seconds: 30..600 (the longest window accepted; the mic's windows are ≤ 30 s)}.
dictation: none
# dictation: { model: whisper-large-v3-turbo, timeout_seconds: 30, max_seconds: 120 }
# terminal:      an agent session's live terminal in the dashboard (the Agents sidebar's Open terminal, a card's
#                Terminals): its tmux pane in the browser, read-only until you press Take control. The screen and your
#                keys cross the web: only a signed-in session, only from this app's own page (Origin), only a session
#                busyyaks registered; every open / take / release is logged on the session's cards.
#                public_host: allow | deny — whether it opens through PUBLIC_HOST (the TLS proxy / tunnel);
#                  127.0.0.1 / localhost on WEB_HOST_PORT (an ssh -L forward included) always may.
#                max_open: 1..64 — terminals open at once (each holds a thread of the web process); one more → 503.
terminal: { public_host: deny, max_open: 8 }
# ci:            how the github service reads a card's PR checks for the approval gate (docs/DEPLOY.md § CI checks).
#                max_pending_minutes: 1..1440 — a required check pending longer than this (since it was posted / started)
#                  is `stuck`: the gate says so and pings the card's owner once, instead of "CI is still running" forever.
#                required: per repo (owner/name, as on github.com), the status contexts / check-run names that gate
#                  (Jenkins posts `jenkins/ci`). Every other check on the commit is informational — named when it fails,
#                  never a refusal. Every repo whose PRs cards are assigned must be listed: one that is not is refused
#                  with that reason on its card, never guessed. A handoff's ci_url must be the build URL a required
#                  check names for the head it hands over.
ci:
  max_pending_minutes: 60
  required:
    your-user/your-repo: [jenkins/ci]
# launch:        which repos bin/launcher answers Claude Code's folder-trust prompt for ("Yes, I trust this folder"),
#                which lets the repo's own .claude settings, hooks and .mcp.json run. Never decided from the repo
#                itself (its origin or config: whoever wrote the repo wrote those). Trusted are only:
#                  trusted_paths: repo dirs you list (paths inside the container, under PROJECTS_MOUNT, like roots;
#                    each exactly that dir, never what lies under it; bin/launcher refuses to start when one is
#                    missing or resolves outside PROJECTS_ROOT). [] = none;
#                  and the repos the launcher's "new repo" (git init) made — never a clone (recorded in .env
#                  LAUNCHER_STATE_DIR).
#                Every other repo keeps the prompt on screen: the launch says so, and a card its session owns gets it
#                as a question for you.
launch:
  trusted_paths: []
  # each agent session in its own systemd user scope, or null when this host runs no systemd user manager
  # (required key). lead_oomd: avoid = a lead's scope is marked ManagedOOMPreference=avoid (per systemd docs oomd then
  # prefers other candidates; not verified under pressure), none = no preference; session_memory_max: every OTHER
  # session's MemoryMax (<n>K|M|G, null = no cap). Restart the launcher after an edit.
  scopes: { lead_oomd: avoid, session_memory_max: null }
  # the INVOCATIONS any agent launcher may be on this host, each exactly {kind, command, args, via_shell}.
  # The launchers + agent types are edited on Settings → Agents & launchers (the database); a launcher must equal one
  # of these entries, or it is refused when saved and when bin/launcher starts it — a dashboard user picks among them
  # and names them, but cannot add an argument (a --settings with hooks, an --mcp-config, a permission mode) you did
  # not list here. A host file: no dashboard user can widen it. Never list a shell or an interpreter as a command
  # (bash, sh, python, …). Restart the launcher after an edit. More, e.g.:
  #   - { kind: claude_code, command: claude, args: ["--permission-mode", "bypassPermissions"], via_shell: false }
  #   - { kind: claude_code, command: my_claude_function, args: [], via_shell: true }
  #   - { kind: hermes, command: hermes, args: [chat], via_shell: false }
  commands:
    - { kind: claude_code, command: claude, args: [], via_shell: false }
  # trusted_paths: [/projects/my-app, /projects/group/tool]
  # seconds bin/launcher waits after starting a session for claude to come up (claude --remote-control <session>)
  # while the launcher's command is still running — a shell function that starts a gateway or opens an ssh forward
  # first needs longer than a plain `claude`. Integer 1..600, required. Not up by then → the session is killed and the
  # launch refused with the pane's last lines; a command that exits into the pane's bare shell is refused at once.
  start_seconds: 30
# skills:        the skills bin/launcher hands every session it launches or spawns (docs/DEPLOY.md
#                § Skills) — per launch only (Claude Code --plugin-dir, hermes ${BUSYYAKS_SKILLS_DIR}/busyyaks-skills in
#                its config's skills.external_dirs), never installed
#                for every session of the user. busyyaks's own = skills/ of this checkout.
#                  max_bytes        one skill dir's size limit (bytes)
#                  max_start_bytes  the `load: start` bodies of one launch together (the entry skill)
#                  project          allow | deny: a repo's own .busyyaks/skills.yml skills load (allow) — only in a
#                                   repo the folder trust trusts (launch.trusted_paths, or made by the launcher);
#                                   any other repo starts with busyyaks's skills and the launch says "left: <why>"
#                  local_dir        this deployment's own skills (a dir of this checkout holding a manifest.yml +
#                                   skill dirs, the skills/ format), or null
skills: { max_bytes: 65536, max_start_bytes: 32768, project: allow, local_dir: null }
# engines:       (optional) more engine names your agent_engines collector reports → {label, family}, merged
#                 over the committed config/engines.yml (claude, claudeapi, localclaude, hermes); an entry with
#                 a name from there relabels it. family: claude (Claude Code) · hermes. A pane whose engine is in
#                 neither shows "<name> (not configured)" and a screen error naming this key.
engines:
  # a renamed Claude Code wrapper your collector reports under its own name
  claude-local: { label: Local, family: claude }
# daily_report_runners: (optional; absent = none) what a daily report runner may EXECUTE on this host. How the daily
#                report runs (schedule, cutoff, timeouts, gateway, models, runner) is in the database, edited on
#                Settings → Daily report (docs/DAILY-REPORT.md); a saved runner must equal one entry here on
#                its type's host keys — a dashboard session picks among these, never names a program or a directory.
#                hermes: command (on the host PATH), home (a dedicated HERMES_HOME; its config.yaml is generated every
#                run). The old `daily_report` key is refused (import it: bin/daily-report-settings import < file).
daily_report_runners:
  - { type: hermes, command: hermes, home: /home/you/.hermes-busyyaks }
