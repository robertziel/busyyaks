# The REPO DEFAULT agent settings: the launchers (the commands that start an agent session) and the agent types (what
# a session IS). They live in the DATABASE (table agent_settings), edited on Settings → Agents & launchers
# (the header's cog); the migration 20261202000000 seeds this file as the first revision. A launcher's command must be
# on the host allowlist config/busyyaks.yml launch.commands, or bin/launcher refuses the launch. Same keys and rules
# as the engine's host config (vendor/agents_kanban/config.example.yml).
# the commands that start a session (the engine's Launch builds the argv; `--remote-control <session>` is appended
# LAST by Launch itself, so no launcher names it). What is typed and which model: agent_types.
# This example runs plain `claude` (Claude Code) in its default permission mode: a tool call your Claude Code
# settings do not allow stops on a permission prompt, and busyyaks turns that prompt into a question on the card
# (its needs_operator flag) that you answer from the board. Add launchers for your box, e.g.:
#   - a shell function of your profile (via_shell: run through `bash -ic`), say one that points Claude Code at
#     another model gateway — list it in each type's `launchers` below:
#       - { key: localclaude, label: localclaude, command: localclaude, args: [], via_shell: true }
#   - Claude Code without any permission prompt. Only on a machine and repos you trust the agent with completely: it
#     then runs every command and edit with no question asked (Claude Code's bypassPermissions mode):
#       - { key: unattended, label: unattended, command: claude, args: ["--permission-mode", "bypassPermissions"], via_shell: false }
launchers:
  - { key: claude, label: claude, kind: claude_code, command: claude, args: [], via_shell: false }
# the agent types the Launch bar offers (one split pill each; the menu = the type's launchers). A launch registers
# the session with the engine BEFORE tmux starts it: a `lead` adopts the project's ownerless cards in the columns of
# the TYPES in `takes` (every work type and the gates) by rule — no prompt asks it to claim; the prompt's {cards} tells
# it what it owns. LEAD-FIRST: a board starts with its lead, and only the lead starts its team — a type
# `under: lead` runs only while the board's lead runs (from the Launch bar, or the lead's kanban_spawn — the agent
# handles no key: bin/launcher keeps it; a guard against cooperative agents, not authentication — one MCP bearer can
# name any tmux session), on the lead's launcher; `plain` is `standalone` (a plain session: no prompt,
# adopts nothing). Every type is the lead, under it, or standalone. Busyyaks starts nothing on its own: with
# no lead an ownerless card waits and the board says "no lead: press Launch". A question for the operator is the
# card's needs_operator FLAG (kanban_ask), never a column — the card keeps its place.
# Per type:
#   launchers       the launcher keys it may run. A start names one (the Launch bar always does) or the type has only
#                   one — nothing picks one of several. A session started by hand registers with
#                   kanban_register(..., launcher) unless its type has one
#   under           (optional) the lead type a session of this type runs under: only while the board's lead runs, on
#                   its launcher (another one asked for → 422)
#   model           null = Claude Code's own model choice; or `--model <id>` for every launcher; or a map launcher key
#                   → id / null (null under a gateway launcher: a --model would override the gateway's model — Claude
#                   Code takes the LAST --model)
#   prompt          typed after the start; placeholders {slug} {dir} {session} {agent} {type} {cards}. The prompts
#                   name no column: every board's columns and transitions are the operator's (the Workflow editor),
#                   so an agent reads where a card may go next from kanban_card's `transitions`. A prompt says
#                   only who the session is: the board workflow is busyyaks's skills (skills/manifest.yml),
#                   which bin/launcher hands each session it starts — Claude Code: the prompt is prefixed
#                   with /busyyaks:session (the entry skill) and --plugin-dir <stage> added; hermes: -s
#                   busyyaks-session. null = the entry skill alone
# Caps: none (0 = no cap) except one lead per board.
#
agent_types:
  - key: lead
    label: Launch
    launchers: [claude]
    model: null
    prompt: |
      Busyyaks session for {slug} ({dir}). Your tmux session is {session}; on the board you are {agent} ({type}); your comment header role is `Team Lead`.
      Your session is registered with the board and owns these cards: {cards}.
      Every card you create with mcp__busyyaks__kanban_create is owned by your session when author is {agent} (or pass tmux_session "{session}").
      Reply with one line: the card ids you own (or "none"). Then wait.
    agent_name: "claude-{session}"
    session_name: "{slug}_teamlead"
    takes: [queued, working, review, gate]
    max: 0
    # ONE lead per board, always: two leads adopt the same cards. Not a capacity cap.
    max_per_project: 1
  # ONE session per card, started by the board's LEAD (kanban_spawn) for a card it owns or nobody owns: the new worker
  # owns that card from its start. Under the lead: no lead running → no worker, from the Launch bar either.
  - key: worker
    label: Worker
    launchers: [claude]
    model: null
    # runs under the board's lead, on its launcher (a lead started on another launcher → its workers run that one)
    under: lead
    prompt: |
      Worker session for {slug} ({dir}). Your tmux session is {session}; on the board you are {agent} ({type}) — the author of these cards.
      You were started for exactly these cards: {cards}. Work ONLY on these. Read each with mcp__busyyaks__kanban_card (description AND activity: resume where a gone session stopped; its `transitions`: where an agent may move it next) and mcp__busyyaks__kanban_workflow; move a card only along the transitions kanban_card lists for agents (kanban_move with `transition`, author "{agent}"). A card I approved: take the next step for that column.
    agent_name: "worker-{session}"
    session_name: "{slug}_worker"
    takes: []
    max: 0
    max_per_project: 0
  - key: team
    label: Sub team
    launchers: [claude]
    model: null
    under: lead   # a sub team runs only while the board's lead runs, on its launcher; another one asked for → 422
    prompt: |
      Busyyaks sub team for {slug} ({dir}). Dispatch subagents IN PARALLEL (one per area: recent commits, uncommitted work, open/unmerged branches) to review this repo, read-only. Then record the result with mcp__busyyaks__add_note (project "{slug}", author "{agent}"): compact tables, shas, max 5 "act on" bullets. Do not modify, commit or push anything unless I ask in this session.
      Your tmux session is {session}; on the board you are {agent}: a card you create with mcp__busyyaks__kanban_create (author "{agent}") is owned by this session; a card you take over: mcp__busyyaks__kanban_claim with tmux_session "{session}".
    agent_name: "team-{session}"
    session_name: "{slug}_team"
    takes: []
    max: 0
    max_per_project: 0
  - key: plain
    label: Plain
    launchers: [claude]
    model: null
    prompt: null
    agent_name: "claude-{session}"
    session_name: "{slug}"
    takes: []
    max: 0
    max_per_project: 0
    standalone: true   # a plain session runs without a lead: no prompt, adopts nothing
