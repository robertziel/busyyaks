roots:
  - { path: /projects/none, prefix: "" }
search_depth: 2
owner_remotes: [example.com/x/]
author_emails: [me@x.io]
window_days: 7
reap_protect: ["svc-*"]
auth: { provider: test/fixtures/auth_stub, allowed_emails: [owner@example.com] }
agents: { collector: none }
launch:
  trusted_paths: []
  start_seconds: 30
  commands: # the invocations of test/fixtures/agents.yml's launchers
    - { kind: claude_code, command: claude, args: ["--permission-mode", "bypassPermissions"], via_shell: false }
    - { kind: claude_code, command: localclaude, args: [], via_shell: true }
daily_report_runners: # what test/unit/daily_report_settings_test.rb's revisions may pick
  - { type: hermes, command: hermes, home: /h/.hermes-busyyaks }
